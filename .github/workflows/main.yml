name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wiiu-builder .

      - name: Build nanddumper.elf and plugin
        run: |
          docker run --rm -v "$PWD":/project wiiu-builder sh -c \
            'make && make -C aroma_plugin WUPS_ROOT=$DEVKITPRO/wups'

      - uses: actions/upload-artifact@v4
        with:
          name: nanddumper
          path: |
            nanddumper.elf
            aroma_plugin/*.wps
